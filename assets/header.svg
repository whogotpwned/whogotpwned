<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="WhoGotPwned — Security Researcher, Offensive Developer, AI Explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9c" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)" opacity=".7"/>

    <!-- soft orbs -->
    <circle cx="160" cy="60" r="140" fill="#00ff9c" opacity=".06">
      <animate attributeName="cx" values="160;220;160" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="220" r="170" fill="#7aa2f7" opacity=".07">
      <animate attributeName="cy" values="220;160;220" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- scanning beam -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;260" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal chrome -->
    <g transform="translate(40 32)">
      <circle cx="10" cy="10" r="6" fill="#f7768e"/>
      <circle cx="30" cy="10" r="6" fill="#e0af68"/>
      <circle cx="50" cy="10" r="6" fill="#9ece6a"/>
      <text x="72" y="15" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#565f89">root@whogotpwned:~</text>
    </g>

    <!-- prompt -->
    <text x="40" y="118" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7aa2f7">$ <tspan fill="#c0caf5">whoami</tspan></text>

    <!-- title -->
    <text x="40" y="186" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="-2">WhoGotPwned<tspan fill="#00ff9c" font-weight="400">_<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <!-- subtitle -->
    <text x="42" y="222" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b9bc7" letter-spacing="1">SECURITY RESEARCHER <tspan fill="#00ff9c">·</tspan> OFFENSIVE DEVELOPER <tspan fill="#00ff9c">·</tspan> AI EXPLORER</text>

    <!-- status chip -->
    <g transform="translate(980 40)">
      <rect width="180" height="34" rx="17" fill="#0f1626" stroke="#1f2a44"/>
      <circle cx="20" cy="17" r="5" fill="#00ff9c">
        <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c0caf5">open to collab</text>
    </g>

    <!-- bottom accent line -->
    <rect x="0" y="257" width="1200" height="3" fill="url(#title)"/>
  </g>
</svg>
